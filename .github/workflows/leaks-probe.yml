name: Leaks Symbolication Probe

# Throwaway experiment: does /usr/bin/leaks name the allocation site when the
# server runs with MallocStackLogging enabled? The macOS leak reports the
# detector receives today carry only a bare address, which gives one leak an
# identity per test file that exposes it. Delete this workflow once the answer
# is recorded.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make -j3 SERVER_CFLAGS='-g'

      - name: leak a known allocation and report, with and without stack logging
        run: |
          set -u
          probe() {
            label="$1"; shift
            echo "=================================================="
            echo "PROBE: $label"
            echo "=================================================="
            # Env vars are exported inside the subshell rather than passed
            # through a wrapper command, so the pid read below is the server's
            # own. A wrapper's pid reports no leaks, since the leak lives in the
            # process it exec'd.
            (
              for assignment in "$@"; do export "$assignment"; done
              exec ./src/valkey-server --port 7777 --daemonize no \
                > "server-$label.log" 2>&1
            ) &
            for _ in $(seq 1 30); do
              ./src/valkey-cli -p 7777 ping 2>/dev/null | grep -q PONG && break
              sleep 1
            done
            pid=$(./src/valkey-cli -p 7777 info server | tr -d '\r' | sed -n 's/^process_id://p')
            echo "server pid: ${pid:-UNKNOWN}"
            echo "leak command: $(./src/valkey-cli -p 7777 debug leak "intentional-leak-for-detector-testing" 2>&1)"

            leaks "$pid" > "leaks-$label.txt" 2>&1 || true
            echo "totals: $(grep -E "leaks? for" "leaks-$label.txt" || echo '(none)')"
            echo "--- ROOT LEAK lines ---"
            grep -E "ROOT LEAK" "leaks-$label.txt" || echo "(none found)"
            if grep -qE "ROOT LEAK:.*<.*\bin [A-Za-z_]" "leaks-$label.txt"; then
              echo "SYMBOLICATED=yes"
            else
              echo "SYMBOLICATED=no"
            fi
            ./src/valkey-cli -p 7777 shutdown nosave 2>/dev/null || true
            sleep 2
            echo
          }

          probe baseline
          probe stacklogging MallocStackLogging=1
          probe stackloggingnocompact MallocStackLogging=1 MallocStackLoggingNoCompact=1

          echo "=================================================="
          echo "RESULT"
          echo "=================================================="
          for f in leaks-*.txt; do
            roots=$(grep -cE "ROOT LEAK" "$f" || true)
            if grep -qE "ROOT LEAK:.*<.*\bin [A-Za-z_]" "$f"; then
              echo "$f: root_lines=$roots SYMBOLICATED"
            else
              echo "$f: root_lines=$roots bare-address-only"
            fi
          done

      - name: upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaks-probe-reports
          path: |
            leaks-*.txt
            server-*.log
