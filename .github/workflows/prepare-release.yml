# Prepare a Valkey release: promote the running changelog and bump the version.
#
# Dispatched manually by a maintainer with write access. It promotes the
# `## Unreleased` block of 00-RELEASENOTES into a dated release section,
# generates the contributor list, sets the version macros in src/version.h,
# re-empties `## Unreleased`, and opens/updates a PR for the release branch.
#
# One long-running release branch per minor line carries the rc1 -> rcN -> GA
# chain (no new branch per stage):
#   * rc1 of M.m.p   -> create  pre-release-M.m.p   from the dispatch ref
#   * rcN (N>1)       -> continue pre-release-M.m.p  (reads its running block)
#   * GA of M.m.p     -> create  M.m  carrying pre-release-M.m.p's history,
#                        then delete pre-release-M.m.p (a true rename)
#   * later patches   -> continue the existing M.m branch (no rename)
#
# The heavy lifting lives in utils/releasetools/ (unit tested); this workflow
# only wires inputs, auth, and the branch/commit/PR plumbing.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (MAJOR.MINOR.PATCH), e.g. 9.1.0"
        required: true
        type: string
      release_stage:
        description: "Release stage, e.g. rc1, ga"
        required: true
        type: string
      urgency:
        description: "Upgrade urgency"
        required: true
        type: choice
        options:
          - LOW
          - MODERATE
          - HIGH
          - CRITICAL
          - SECURITY
      date:
        description: "Release date YYYY-MM-DD (default: today)"
        required: false
        type: string
        default: ""
      base_ref:
        description: "Contributor range start (default: most recent tag)"
        required: false
        type: string
        default: ""
      base_branch_to_empty:
        description: "Branch whose ## Unreleased block to empty after draining (default: the branch this workflow is dispatched from)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release ${{ inputs.version }}
    # EDIT BEFORE PR: Guard against forks running the release machinery with org secrets.
    # if: github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    # EDIT BEFORE PR: delete this permissions block
    # The built-in GITHUB_TOKEN needs write scope to push release-prep/* and open
    # the PR. In valkey-io/valkey the App token carries its own scopes, so the
    # job inherits the top-level `permissions: contents: read` and this is unneeded.
    permissions:
      contents: write
      pull-requests: write
    # === end FORK TEST ===
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # EDIT BEFORE PR:
      # No VALKEYRIE_BOT_* secrets exist in a personal fork, so the App-token step
      # below fails immediately. For fork testing we skip token generation entirely
      # and use the built-in GITHUB_TOKEN (scoped via the job `permissions` block
      # above). The two steps below reference this id; see their FORK TEST notes.
      - name: Use built-in GITHUB_TOKEN (fork test)
        id: app-token
        run: echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
      # === end FORK TEST ===

      # EDIT BEFORE PR: Restore the App-token step (uncomment) and DELETE the
      # "Use built-in GITHUB_TOKEN (fork test)" step above. The downstream steps
      # already read steps.app-token.outputs.token, so no other change is needed.
      # - name: Generate GitHub App token
      #   id: app-token
      #   uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
      #   with:
      #     app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
      #     private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: valkey
      #     permission-contents: write
      #     permission-pull-requests: write

      - name: Resolve the running release branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
        run: |
          set -euo pipefail

          # Split MAJOR.MINOR.PATCH and the stage.
          IFS='.' read -r MAJOR MINOR PATCH <<<"${VERSION}"
          STAGE_LC="$(printf '%s' "${STAGE}" | tr '[:upper:]' '[:lower:]')"

          # One long-running branch per minor line:
          #   rc stages -> pre-release-M.m.p
          #   ga / later -> M.m   (the rc branch is renamed to this at GA)
          PRE_BRANCH="pre-release-${MAJOR}.${MINOR}.${PATCH}"
          GA_BRANCH="${MAJOR}.${MINOR}"

          # remote branch existence helper
          exists() { git ls-remote --exit-code --heads origin "refs/heads/$1" >/dev/null 2>&1; }

          if [ "${STAGE_LC}" = "ga" ]; then
            TARGET="${GA_BRANCH}"
            # Base GA on the existing rc branch (carrying its history) if present;
            # if GA already exists (re-run / later patch), continue it; else fall
            # back to the dispatch ref (a GA with no prior rc).
            if exists "${GA_BRANCH}"; then
              BASE_REF="${GA_BRANCH}";  CONTINUE="true";  RENAME_FROM=""
            elif exists "${PRE_BRANCH}"; then
              BASE_REF="${PRE_BRANCH}"; CONTINUE="true";  RENAME_FROM="${PRE_BRANCH}"
            else
              BASE_REF="${GITHUB_REF_NAME}"; CONTINUE="false"; RENAME_FROM=""
            fi
          else
            TARGET="${PRE_BRANCH}"
            RENAME_FROM=""
            # rcN>1 continues the existing pre-release branch; rc1 (or a missing
            # branch) starts fresh from the dispatch ref.
            if exists "${PRE_BRANCH}"; then
              BASE_REF="${PRE_BRANCH}"; CONTINUE="true"
            else
              BASE_REF="${GITHUB_REF_NAME}"; CONTINUE="false"
              # A later rc (rcN, N>1) expects the running branch from the previous
              # rc. If it is missing, this cut starts fresh from the dispatch ref,
              # so any notes accumulated on pre-release-M.m.p between cuts are NOT
              # carried over -- warn (non-blocking) so a maintainer can confirm the
              # branch was meant to be gone rather than deleted by accident.
              if [[ "${STAGE_LC}" =~ ^rc([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -gt 1 ]; then
                PREV_RC="rc$(( BASH_REMATCH[1] - 1 ))"
                MSG="No running release branch ${PRE_BRANCH} found for ${STAGE_LC} (expected from ${PREV_RC}). Starting fresh from ${GITHUB_REF_NAME}; notes accumulated on a prior rc are not carried over."
                echo "::warning::${MSG}"
                echo "⚠️ ${MSG}" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          {
            echo "target=${TARGET}"
            echo "base_ref=${BASE_REF}"
            echo "continue=${CONTINUE}"
            echo "rename_from=${RENAME_FROM}"
            echo "stage_lc=${STAGE_LC}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: stage=${STAGE_LC} target=${TARGET} base=${BASE_REF} continue=${CONTINUE} rename_from=${RENAME_FROM:-<none>}"

      - name: Materialize the release branch destination
        id: dest
        env:
          TARGET: ${{ steps.branch.outputs.target }}
          BASE_REF: ${{ steps.branch.outputs.base_ref }}
          CONTINUE: ${{ steps.branch.outputs.continue }}
        run: |
          set -euo pipefail
          # The notes SOURCE is this checkout (the dispatch/base branch), whose
          # ## Unreleased block carries the bullets for this cut. The DESTINATION is
          # the running release branch ${TARGET}; we materialize it in a separate
          # worktree so the current checkout (with the release tooling) stays as cwd.
          # promote() drains the source block onto the destination's frozen changelog
          # via --prior-notes-file, then we empty the source block in place.
          git fetch origin "${BASE_REF}"
          WT="$(mktemp -d)/dest"
          git worktree add -B "${TARGET}" "${WT}" "origin/${BASE_REF}"

          # First cut of a line (continue=false) starts the destination changelog
          # from scratch: there is no prior dated section to prepend, so the
          # destination file is just the source's notes content. Seed it so the
          # promote step always has a prior file to read; promote() prepends the new
          # dated section and writes the destination frozen (no ## Unreleased block).
          if [ "${CONTINUE}" != "true" ]; then
            : > "${WT}/00-RELEASENOTES"
          fi
          echo "wt=${WT}" >> "$GITHUB_OUTPUT"

      - name: Promote notes (drain base -> release branch) and bump version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
          WT: ${{ steps.dest.outputs.wt }}
        run: |
          set -euo pipefail
          # --repo-dir is the SOURCE checkout (this dir); --notes-file is the source
          # block. --prior-notes-file and --version-file point at the DESTINATION
          # worktree (absolute paths, so --repo-dir does not apply to them). The
          # destination 00-RELEASENOTES is rewritten frozen; version.h is bumped there.
          args=(
            utils/releasetools/prepare_release.py
            --version "${VERSION}"
            --stage "${STAGE}"
            --urgency "${{ inputs.urgency }}"
            --repo "${{ github.repository }}"
            --notes-file 00-RELEASENOTES
            --prior-notes-file "${WT}/00-RELEASENOTES"
            --version-file "${WT}/src/version.h"
          )
          if [[ -n "${{ inputs.date }}" ]]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [[ -n "${{ inputs.base_ref }}" ]]; then
            args+=(--base-ref "${{ inputs.base_ref }}")
          fi
          python3 "${args[@]}"

      - name: Commit and push the release branch, open/update its PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
          TARGET: ${{ steps.branch.outputs.target }}
          STAGE_LC: ${{ steps.branch.outputs.stage_lc }}
          RENAME_FROM: ${{ steps.branch.outputs.rename_from }}
          WT: ${{ steps.dest.outputs.wt }}
        run: |
          set -euo pipefail

          # Stage-qualified version and PR/commit title, matching existing
          # release PRs. The VERSION input is only MAJOR.MINOR.PATCH, so the
          # stage suffix and the title form are derived here:
          #   rc stages -> "Update version to 9.1.0-rc2 and add release notes"
          #                (cf. #3521 rc2, #3333 rc1)
          #   ga        -> "Add release notes entry for Valkey 9.1.0 GA"
          #                (cf. #3682; GA uses a distinct title -- not
          #                "Update version to ..." -- and the bare version)
          if [ "${STAGE_LC}" = "ga" ]; then
            RELEASE_NAME="${VERSION}"
            TITLE="Add release notes entry for Valkey ${RELEASE_NAME} GA"
          else
            RELEASE_NAME="${VERSION}-${STAGE_LC}"
            TITLE="Update version to ${RELEASE_NAME} and add release notes"
          fi

          # Identity for the signed-off commit. Matches provenance-refresh.yml,
          # the repo's other workflow that commits to GitHub: the standard
          # github-actions[bot], which is also the actor the push authenticates as.
          git -C "${WT}" config user.name "github-actions[bot]"
          git -C "${WT}" config user.email "github-actions[bot]@users.noreply.github.com"

          git -C "${WT}" add 00-RELEASENOTES src/version.h
          if git -C "${WT}" diff --cached --quiet; then
            echo "No changes to commit; nothing to prepare." >> "$GITHUB_STEP_SUMMARY"
            git worktree remove --force "${WT}"
            exit 0
          fi
          git -C "${WT}" commit -s -m "${TITLE}"

          # Push the running release branch. It is owned solely by this workflow,
          # so a force push is safe and lets a re-dispatch cleanly replace the tip.
          git -C "${WT}" push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${TARGET}"

          # GA rename: the rc line's history now lives on ${TARGET} (= M.m); delete
          # the old pre-release-M.m.p branch so only one running branch survives.
          # Deleting it closes any PR still open from that branch -- by policy the
          # prior rcN PRs are merged before a new stage is cut, so nothing live is
          # lost. Best-effort: a missing branch is not an error.
          if [ -n "${RENAME_FROM}" ]; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              --delete "${RENAME_FROM}" || echo "Note: could not delete ${RENAME_FROM} (already gone?)."
            echo "Renamed \`${RENAME_FROM}\` -> \`${TARGET}\` (deleted the old branch)." >> "$GITHUB_STEP_SUMMARY"
          fi

          BODY=$(cat <<EOF
          Automated release preparation for **${RELEASE_NAME}** (\`${STAGE}\`).

          - Drained the \`## Unreleased\` block of the base branch into a new dated section
          - Generated the contributor list for this release
          - Set the version macros in \`src/version.h\`

          This is the running release branch \`${TARGET}\` for the ${VERSION%.*} line;
          each rc/GA cut drains the base branch's notes onto it. The base branch's
          \`## Unreleased\` block is emptied by the companion PR below. Please review
          the notes, urgency, and any Security Fixes before merging.
          EOF
          )

          # Open a PR for this branch, or update the open one. By policy a prior
          # rcN PR is merged before the next stage is cut, so gh pr create
          # normally opens a fresh PR; if one is still open for ${TARGET} it is
          # updated in place instead.
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${TARGET}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            || gh pr edit "${TARGET}" --title "${TITLE}" --body "${BODY}"

          git worktree remove --force "${WT}"

          echo "## Prepared release ${VERSION} (${STAGE})" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`${TARGET}\` and opened/updated its PR into \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"

      # Companion PR: empty the base branch's ## Unreleased block. This cut drained
      # those bullets onto the running release branch, so they must be cleared from
      # the base or the next cut would drain (and promote) them again. The base
      # branch is the dispatch ref (GITHUB_REF_NAME) by default -- the branch this
      # workflow runs from, where contributors accumulate notes -- or an explicit
      # override via the base_branch_to_empty input. We materialize it in a worktree
      # so the current checkout (with the release tooling) stays as cwd, and edit its
      # file via --repo-dir (reset-only mode does no git ops, only reads/writes the
      # notes file under that dir).
      - name: Empty the base branch's Unreleased block and open companion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
          BASE_BRANCH: ${{ inputs.base_branch_to_empty != '' && inputs.base_branch_to_empty || github.ref_name }}
          TARGET: ${{ steps.branch.outputs.target }}
        run: |
          set -euo pipefail
          # Skip cleanly if the release step found nothing to push (no release branch
          # on the remote means nothing was drained, so nothing to clear).
          if ! git ls-remote --exit-code --heads origin "refs/heads/${TARGET}" >/dev/null 2>&1; then
            echo "No release branch ${TARGET} on remote; skipping base reset." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESET_BRANCH="release-prep/reset-unreleased-${VERSION}-${STAGE}"
          TITLE="Empty Unreleased on ${BASE_BRANCH} after ${VERSION} ${STAGE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_BRANCH}"
          WT="$(mktemp -d)/base"
          git worktree add -b "${RESET_BRANCH}" "${WT}" "origin/${BASE_BRANCH}"

          python3 utils/releasetools/prepare_release.py \
            --version "${VERSION}" \
            --stage "${STAGE}" \
            --urgency "${{ inputs.urgency }}" \
            --repo "${{ github.repository }}" \
            --repo-dir "${WT}" \
            --reset-unreleased-only

          git -C "${WT}" add 00-RELEASENOTES
          if git -C "${WT}" diff --cached --quiet; then
            echo "## Unreleased on ${BASE_BRANCH} already empty; no companion PR." >> "$GITHUB_STEP_SUMMARY"
            git worktree remove --force "${WT}"
            exit 0
          fi

          git -C "${WT}" commit -s -m "${TITLE}"
          git -C "${WT}" push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${RESET_BRANCH}"

          BODY=$(cat <<EOF
          Empties the \`## Unreleased\` block of \`00-RELEASENOTES\` on \`${BASE_BRANCH}\`
          now that **${VERSION}** (\`${STAGE}\`) has been cut. Those bullets were drained
          into the dated section on the running release branch, so clearing them here
          keeps the base branch ready for the next cut's notes and prevents them being
          promoted twice.

          Generated by the \`prepare-release\` workflow as the companion to the release PR.
          EOF
          )

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${RESET_BRANCH}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            || gh pr edit "${RESET_BRANCH}" --title "${TITLE}" --body "${BODY}"

          git worktree remove --force "${WT}"

          echo "Opened companion PR from \`${RESET_BRANCH}\` into \`${BASE_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
