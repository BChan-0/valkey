# Prepare a Valkey release: promote the running changelog and bump the version.
#
# Dispatched manually by a maintainer with write access. It promotes the
# `## Unreleased` block of 00-RELEASENOTES into a dated release section,
# generates the contributor list, sets the version macros in src/version.h,
# resets `## Unreleased` to empty, and opens a PR titled
# "Update version to <version> and add release notes".
#
# The heavy lifting lives in utils/releasetools/ (unit tested); this workflow
# only wires inputs, auth, and the branch/commit/PR plumbing.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (MAJOR.MINOR.PATCH), e.g. 9.1.0"
        required: true
        type: string
      release_stage:
        description: "Release stage, e.g. rc1, ga"
        required: true
        type: string
      urgency:
        description: "Upgrade urgency"
        required: true
        type: choice
        options:
          - LOW
          - MODERATE
          - HIGH
          - CRITICAL
          - SECURITY
      date:
        description: "Release date YYYY-MM-DD (default: today)"
        required: false
        type: string
        default: ""
      base_ref:
        description: "Contributor range start (default: most recent tag)"
        required: false
        type: string
        default: ""
      unstable_branch:
        description: "Branch whose ## Unreleased block to reset in a companion PR (empty to skip)"
        required: false
        type: string
        default: "unstable"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release ${{ inputs.version }}
    # EDIT BEFORE PR: Guard against forks running the release machinery with org secrets.
    # if: github.repository == 'valkey-io/valkey'
    runs-on: ubuntu-latest
    # === FORK TEST — DELETE this permissions block before moving to valkey-io/valkey ===
    # The built-in GITHUB_TOKEN needs write scope to push release-prep/* and open
    # the PR. In valkey-io/valkey the App token carries its own scopes, so the
    # job inherits the top-level `permissions: contents: read` and this is unneeded.
    permissions:
      contents: write
      pull-requests: write
    # === end FORK TEST ===
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # === FORK TEST — DELETE this step before moving to valkey-io/valkey ===
      # No VALKEYRIE_BOT_* secrets exist in a personal fork, so the App-token step
      # below fails immediately. For fork testing we skip token generation entirely
      # and use the built-in GITHUB_TOKEN (scoped via the job `permissions` block
      # above). The two steps below reference this id; see their FORK TEST notes.
      - name: Use built-in GITHUB_TOKEN (fork test)
        id: app-token
        run: echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
      # === end FORK TEST ===

      # EDIT BEFORE PR: Restore the App-token step (uncomment) and DELETE the
      # "Use built-in GITHUB_TOKEN (fork test)" step above. The downstream steps
      # already read steps.app-token.outputs.token, so no other change is needed.
      # - name: Generate GitHub App token
      #   id: app-token
      #   uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
      #   with:
      #     app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
      #     private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: valkey
      #     permission-contents: write
      #     permission-pull-requests: write

      - name: Prepare release notes and version bump
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
        run: |
          set -euo pipefail
          args=(
            utils/releasetools/prepare_release.py
            --version "${VERSION}"
            --stage "${STAGE}"
            --urgency "${{ inputs.urgency }}"
            --repo "${{ github.repository }}"
          )
          if [[ -n "${{ inputs.date }}" ]]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [[ -n "${{ inputs.base_ref }}" ]]; then
            args+=(--base-ref "${{ inputs.base_ref }}")
          fi
          python3 "${args[@]}"

      - name: Create branch, commit, and open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
        run: |
          set -euo pipefail
          BRANCH="release-prep/${VERSION}-${STAGE}"
          TITLE="Update version to ${VERSION} and add release notes"

          # Identity for the signed-off commit (Valkeyrie bot).
          git config user.name "valkey-ci-bot"
          git config user.email "valkey-ci-bot@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add 00-RELEASENOTES src/version.h

          if git diff --cached --quiet; then
            echo "No changes to commit; nothing to prepare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -s -m "${TITLE}"

          # Authenticated push for the App token. The release-prep/* namespace is
          # owned solely by this workflow, so a force push is safe and lets a
          # re-dispatch for the same version/stage cleanly replace the branch.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH}"

          BODY=$(cat <<EOF
          Automated release preparation for **${VERSION}** (\`${STAGE}\`).

          - Promoted the \`## Unreleased\` block of \`00-RELEASENOTES\` into a dated section
          - Generated the contributor list for this release
          - Dropped the \`## Unreleased\` block (a cut release line is frozen)
          - Set the version macros in \`src/version.h\`

          Generated by the \`prepare-release\` workflow. Please review the notes,
          urgency, and any Security Fixes before merging.

          A companion PR resets the \`## Unreleased\` block on \`${{ inputs.unstable_branch }}\`.
          EOF
          )

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            || gh pr edit "${BRANCH}" --title "${TITLE}" --body "${BODY}"

          echo "## Prepared release ${VERSION} (${STAGE})" >> "$GITHUB_STEP_SUMMARY"
          echo "Opened release PR from \`${BRANCH}\` into \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"

      # Companion PR: clear the just-released bullets from the unstable branch's
      # running ## Unreleased block. The release-branch file is frozen (no block),
      # but unstable must keep an emptied block for future PRs to append to. We cut
      # a fresh checkout of the unstable branch so this never carries the dated
      # section or the version bump from the release PR above.
      - name: Reset Unreleased on unstable and open companion PR
        if: ${{ inputs.unstable_branch != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.release_stage }}
          UNSTABLE: ${{ inputs.unstable_branch }}
        run: |
          set -euo pipefail
          # Skip cleanly if the release step found nothing to commit (no branch).
          BRANCH="release-prep/${VERSION}-${STAGE}"
          if ! git rev-parse --verify "${BRANCH}" >/dev/null 2>&1; then
            echo "No release branch ${BRANCH}; skipping unstable reset." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESET_BRANCH="release-prep/reset-unreleased-${VERSION}-${STAGE}"
          TITLE="Reset Unreleased after ${VERSION} ${STAGE} release"

          git config user.name "valkey-ci-bot"
          git config user.email "valkey-ci-bot@users.noreply.github.com"

          # Start from the tip of the unstable branch, not the release branch.
          git fetch origin "${UNSTABLE}"
          git checkout -b "${RESET_BRANCH}" "origin/${UNSTABLE}"

          python3 utils/releasetools/prepare_release.py \
            --version "${VERSION}" \
            --stage "${STAGE}" \
            --urgency "${{ inputs.urgency }}" \
            --repo "${{ github.repository }}" \
            --reset-unreleased-only

          git add 00-RELEASENOTES
          if git diff --cached --quiet; then
            echo "## Unreleased on ${UNSTABLE} already empty; no companion PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -s -m "${TITLE}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${RESET_BRANCH}"

          BODY=$(cat <<EOF
          Clears the \`## Unreleased\` block of \`00-RELEASENOTES\` now that
          **${VERSION}** (\`${STAGE}\`) has been cut. The released bullets live in the
          dated section on the release branch; this keeps an emptied block on
          \`${UNSTABLE}\` for future PRs to append to.

          Generated by the \`prepare-release\` workflow as the companion to the release PR.
          EOF
          )

          gh pr create \
            --base "${UNSTABLE}" \
            --head "${RESET_BRANCH}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            || gh pr edit "${RESET_BRANCH}" --title "${TITLE}" --body "${BODY}"

          echo "Opened companion PR from \`${RESET_BRANCH}\` into \`${UNSTABLE}\`." >> "$GITHUB_STEP_SUMMARY"
